# 启动：docker compose -f docker-compose.prod.yml up -d --build
# 环境变量由各服务的 env_file 指定为 apps/server/.env
# 后端也在 compose 网络里，DB_HOST、REDIS_HOST 写 postgres、redis，RABBITMQ_URL 的主机写 rabbitmq。

services:
  # 数据库 postgres。镜像只认 POSTGRES_*，启动时从 DB_* 映射
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ragflux-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./apps/server/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        export POSTGRES_DB="$$DB_DATABASE"
        exec docker-entrypoint.sh postgres
    volumes:
      - ./dockerStore/postgres:/var/lib/postgresql
      - ./dockerStore/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_USER\" -d \"$$DB_DATABASE\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 缓存 redis
  redis:
    image: redis:8
    container_name: ragflux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - ./apps/server/.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - ./dockerStore/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 消息队列 rabbitmq。用户名和密码取自 RABBITMQ_URL
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ragflux-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./apps/server/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        creds="$${RABBITMQ_URL#*://}"
        creds="$${creds%%@*}"
        export RABBITMQ_DEFAULT_USER="$${creds%%:*}"
        export RABBITMQ_DEFAULT_PASS="$${creds#*:}"
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - ./dockerStore/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 前端 web。镜像内的 nginx 直接托管构建产物，监听 80
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ragflux-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  # 后端 server
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: ragflux-server
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
    env_file:
      - ./apps/server/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
